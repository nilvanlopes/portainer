services:
  agent:
    environment:
      # Single-node Swarm only; avoids DNS/healthcheck startup dependency.
      AGENT_CLUSTER_ADDR: localhost
    image: portainer/agent:lts@sha256:6e6d2d5d8967da5b4d45eab32b7268af170395395d753d3f34ecb4d6ca5bd388
    # Requires the host busybox-static binary on every node running this service.
    healthcheck:
      test: ["CMD", "/busybox", "sh", "-c", "exec /busybox nc -w 3 127.0.0.1 9001 </dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - /usr/bin/busybox:/busybox:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
    cap_drop:
      - ALL

  portainer:
    image: portainer/portainer-ce:lts@sha256:3609c307943bca8e5c492f69ddd6965df177208b50678a4cff28391c8dd4e96e
    # Requires the host busybox-static binary on every node running this service.
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "/dev/null", "-T", "4", "http://127.0.0.1:9000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes:
      - /usr/bin/busybox:/busybox:ro
      - portainer_data:/data
    ports:
      - "9000:9000"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      # Labels mantidas como referencia. O roteamento ativo do Portainer
      # fica em traefik/infra/traefik/dynamic/portainer.yml.
      # labels:
      #   - "traefik.enable=true"
      #   - "traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST}`)"
      #   - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      #   - "traefik.http.routers.portainer.entrypoints=websecure"
      #   - "traefik.http.routers.portainer.tls=true"
      #   - "traefik.http.routers.portainer.tls.certresolver=cloudflare"
      #   - "traefik.docker.network=traefik-public"
      #   - "traefik.http.routers.portainer.middlewares=crowdsec@file"
    networks:
      - agent_network
      - traefik-public
    cap_drop:
      - ALL
    depends_on:
      - agent
networks:
  agent_network:
    driver: overlay
    attachable: true

  traefik-public:
    external: true
    name: traefik-public


volumes:
  portainer_data:

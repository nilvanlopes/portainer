services:
  agent:
    image: portainer/agent:lts@sha256:481254e877ca278b8d6e4ffd37e352ee221fbf712dfb4635edf93c6378ae8c35
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
    cap_drop:
      - ALL
  
  portainer:
    image: portainer/portainer-ce:lts@sha256:18616fff2998f8ca0e8ebe7f028658ae1682859cf43f212f81a849c1093ad639
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes:
      - portainer_data:/data
    ports:
      - "9000:9000"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      # Labels mantidas como referencia. O roteamento ativo do Portainer
      # fica em traefik/infra/traefik/dynamic/portainer.yml.
      # labels:
      #   - "traefik.enable=true"
      #   - "traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST}`)"
      #   - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      #   - "traefik.http.routers.portainer.entrypoints=websecure"
      #   - "traefik.http.routers.portainer.tls=true"
      #   - "traefik.http.routers.portainer.tls.certresolver=cloudflare"
      #   - "traefik.docker.network=traefik-public"
      #   - "traefik.http.routers.portainer.middlewares=crowdsec@file"
    networks:
      - agent_network
      - traefik-public
    cap_drop:
      - ALL
    depends_on:
      - agent
networks:
  agent_network:
    driver: overlay
    attachable: true

  traefik-public:
    external: true
    name: traefik-public


volumes:
  portainer_data:

services:
  agent:
    image: portainer/agent:lts@sha256:4c81dfcb3acc1271d54ca448fb5fe9c8d3bea55b9063cab83643fa1ae4142f73
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 10s
    cap_drop:
      - ALL
  
  portainer:
    image: portainer/portainer-ce:lts@sha256:03f94a406496dc84d37b552795fc424ccad8d0d7200353b6a82915f6e8f73ab0
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes:
      - portainer_data:/data
    ports:
      - "9000:9000"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      # Labels mantidas como referencia. O roteamento ativo do Portainer
      # fica em traefik/infra/traefik/dynamic/portainer.yml.
      # labels:
      #   - "traefik.enable=true"
      #   - "traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST}`)"
      #   - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      #   - "traefik.http.routers.portainer.entrypoints=websecure"
      #   - "traefik.http.routers.portainer.tls=true"
      #   - "traefik.http.routers.portainer.tls.certresolver=cloudflare"
      #   - "traefik.docker.network=traefik-public"
      #   - "traefik.http.routers.portainer.middlewares=crowdsec@file"
    networks:
      - agent_network
      - traefik-public
    cap_drop:
      - ALL
    depends_on:
      - agent
networks:
  agent_network:
    driver: overlay
    attachable: true

  traefik-public:
    external: true
    name: traefik-public


volumes:
  portainer_data:
